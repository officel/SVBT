# リリース準備をするワークフロー
name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release (e.g., patch, minor, major, 1.2.3)"
        required: true
        default: "patch"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
        with:
          version: 10.8.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Git
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bump version and changelog
        shell: bash
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION=$(pnpm version "$VERSION" --no-git-tag-version | tail -n 1)
          BRANCH="release/$VERSION"

          pnpm dlx conventional-changelog-cli -p angular -i CHANGELOG.md -s
          git checkout -b "$BRANCH"
          git add package.json pnpm-lock.yaml CHANGELOG.md
          git commit -m "chore(release): $VERSION"
          git push origin "$BRANCH"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          title: "chore(release): ${{ github.event.inputs.version }}"
          body: "This PR prepares the release by bumping the version and updating the changelog."
